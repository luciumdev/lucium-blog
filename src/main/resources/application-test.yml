spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 30s
jwt:
  secret: test-secret-key-must-be-at-least-32-characters-long-do-not-use-in-prod
  access-expiration: 3600
  refresh-expiration: 604800

cookie:
  secure: false

aws:
  region: ap-northeast-2
  credentials:
    access-key: test-access-key
    secret-key: test-secret-key
  s3:
    bucket: test-bucket
    presigned-url-expiration: 300
  cloudfront:
    base-url: http://localhost/cdn

viewcount:
  flush-delay-ms: 600000
  flush-initial-delay-ms: 600000

logging:
  level:
    com.ysh: DEBUG
    org.flywaydb: INFO

news:
  cache-ttl: 1h

market:
  forex:
    api-key: test-key
    cache-ttl: 1h
  kis:
    app-key: test-kis-app-key
    app-secret: test-kis-app-secret
  commodities:
    goldapi:
      api-key: test-goldapi-key
    alphavantage:
      api-key: test-alphavantage-key

claude:
  api:
    key: test-claude-api-key

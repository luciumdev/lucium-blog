name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 백엔드 테스트 ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Run tests
        run: ./gradlew test

  # ── 프론트 빌드 검증 ───────────────────────────────────────
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install deps
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
      - name: Build (tsc + vite)
        working-directory: ./frontend
        run: pnpm build:check

  # ── 빌드 & 배포 ────────────────────────────────────────────
  build-and-deploy:
    needs: [test, frontend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # OIDC 토큰 발급(id-token) — 장기 AWS 액세스 키 대신 Role assume
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-northeast-2
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 백엔드 이미지
      - name: Build and push blog-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/blog-api:latest
            ${{ secrets.DOCKER_USERNAME }}/blog-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # 프론트 이미지
      - name: Build and push blog-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/blog-web:latest
            ${{ secrets.DOCKER_USERNAME }}/blog-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # AWS 자격증명 — GitHub OIDC → lucium-blog-ci-deploy Role (SSM 호출 전용)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gh-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # EC2 배포 — SSM Run Command (app + web 재시작)
      - name: Deploy to EC2 via SSM
        run: |
          set -euo pipefail

          if [ -z "${INSTANCE_ID}" ]; then
            echo "::error::Repository variable EC2_INSTANCE_ID is not set"
            exit 1
          fi

          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CI deploy ${GITHUB_SHA::7}" \
            --parameters commands='[
              "su - ubuntu -c \"cd /home/ubuntu/blog && docker compose pull app web && docker compose up -d --no-deps app web && docker image prune -f\""
            ]' \
            --query "Command.CommandId" --output text)

          echo "SSM CommandId: $CMD_ID"

          # 실행 완료 대기 (실패해도 아래에서 Status로 판정하므로 || true)
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" || true

          # 결과 조회
          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)

          echo "----- STDOUT -----"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

          echo "----- STDERR -----"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          echo "Deploy status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM deploy failed with status $STATUS"
            exit 1
          fi

# prod 프로파일 — 운영 환경 전용 (환경별로 달라지는 값만)
# 시크릿은 ${ENV} 참조만 (기본값 없음 → 누락 시 fail-fast)
# 공통 상수(풀 설정/외부 API base-url/timeout)는 base(application.yml) 상속
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}

  elasticsearch:
    uris: ${ELASTICSEARCH_URI}

# ── CORS — 운영 도메인만 허용 ──
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://lucium.dev}

# ── Cookie — HTTPS 전용 ──
cookie:
  secure: true

# ── JWT —──
jwt:
  secret: ${JWT_SECRET}

# ── AWS — 운영 버킷 ──
# 자격증명은 EC2 인스턴스 Role(IMDS) 사용 → 액세스 키는 빈 값 허용
#   S3Config: 키가 비어 있으면 DefaultCredentialsProvider 로 전환
aws:
  credentials:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
  s3:
    bucket: ${AWS_S3_BUCKET}
  cloudfront:
    base-url: ${AWS_CLOUDFRONT_BASE_URL}

# ── 외부 API 키 — 운영 실키 필수 ──
market:
  forex:
    api-key: ${KOREAEXIM_API_KEY}
  kis:
    app-key: ${KIS_APP_KEY}
    app-secret: ${KIS_APP_SECRET}
  commodities:
    goldapi:
      api-key: ${GOLDAPI_API_KEY}
    alphavantage:
      api-key: ${ALPHAVANTAGE_API_KEY}

claude:
  api:
    key: ${CLAUDE_API_KEY}

# ── Logging — 운영은 INFO, security는 WARN  ──
logging:
  level:
    com.ysh: INFO
    org.springframework.security: WARN

admin:
  seed:
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}
    nickname: ${ADMIN_SEED_NICKNAME:lucium}

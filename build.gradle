plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ysh'
version = '0.0.1-SNAPSHOT'
description = 'ysh-blog'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
}

dependencies {
    // ── Spring Boot Core ──────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // ── DB ───────────────────────────────────────────────────────
    runtimeOnly  'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // ── JWT ──────────────────────────────────────────────────────
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ── Rate Limiting (Phase 3에서 활성화) ─────────────────────────
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.22.0'
    implementation 'com.bucket4j:bucket4j_jdk17-lettuce:8.17.0'

    // ── OpenAPI / Swagger ─────────────────────────────────────────
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

    // ── AWS S3 ────────────────────────────────────────────────────
    implementation platform('software.amazon.awssdk:bom:2.31.0')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sts'

    // ── Elasticsearch ES 9.2.x  ──────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    // ──  jdom2  ──────────────────────
    implementation 'com.rometools:rome:2.1.0'

    // ── Util ──────────────────────────────────────────────────────
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ── Test ──────────────────────────────────────────────────────
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'com.redis:testcontainers-redis:2.2.4'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.testcontainers:elasticsearch'
    testImplementation 'org.testcontainers:mockserver:1.20.4'
    testImplementation 'org.mock-server:mockserver-client-java:5.15.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('test') {
    useJUnitPlatform()
    // 모든 테스트가 같은 JVM에서 돌도록 — static 컨테이너 공유 보장
    forkEvery = 0
    maxParallelForks = 1
}

springBoot {
    buildInfo()
}
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}
// .env 파일을 읽어 bootRun 환경변수로 주입
tasks.named('bootRun') {
    def envFile = file('.env.local')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            line = line.trim()
            // 빈 줄·주석 스킵
            if (line.isEmpty() || line.startsWith('#')) return
            def idx = line.indexOf('=')
            if (idx <= 0) return
            def key = line.substring(0, idx).trim()
            def value = line.substring(idx + 1).trim()
            // 양끝 따옴표 제거
            if (value.startsWith('"') && value.endsWith('"')) {
                value = value.substring(1, value.length() - 1)
            }
            environment key, value
        }
    }
}
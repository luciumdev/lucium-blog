# base 설정 — 모든 프로파일 공통
# 시크릿/환경별 값은 .env
# 외부 API base-url, timeout, cache-ttl, cron 등 불변 상수만
# 환경별 값(DB, CORS, 로깅 레벨 등)은 application-{profile}.yml 에서 오버라이드

spring:
  application:
    name: ysh-blog
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        show_sql: false
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  elasticsearch:
    connection-timeout: 5s
    socket-timeout: 30s

# ── View count ──
viewcount:
  flush-delay-ms: 600000
  flush-initial-delay-ms: 600000

# ── AWS (region/bucket은 공통, credentials는 프로파일별) ──
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    presigned-url-expiration: 300

# ── News (외부 API 상수) ──
news:
  cache-ttl: 1h
  cache-top-n: 20
  hackernews:
    base-url: https://hacker-news.firebaseio.com
    connect-timeout: 3s
    read-timeout: 5s
    freshness-window: 2d
    score-threshold: 50
    top-limit: 15
  hankyung:
    base-url: https://www.hankyung.com
    connect-timeout: 3s
    read-timeout: 5s
    economy:
      feed-path: /feed/economy

# ── Market (외부 API 상수) ──
market:
  forex:
    base-url: https://oapi.koreaexim.go.kr
    cache-ttl: 1h
    connect-timeout: 3s
    read-timeout: 5s
  indices:
    cache-ttl: 25h
  kis:
    base-url: https://openapivts.koreainvestment.com:29443
    connect-timeout: 3s
    read-timeout: 5s
    token:
      cache-ttl: 23h
      lock-wait: 3s
      lock-lease: 10s
    indices:
      series-depth: 30
  commodities:
    cache-ttl: 25h
    goldapi:
      base-url: https://www.goldapi.io/api
      connect-timeout: 3s
      read-timeout: 5s
    alphavantage:
      base-url: https://www.alphavantage.co
      connect-timeout: 3s
      read-timeout: 5s

# ── Claude API (base-url/timeout 공통, key는 프로파일별) ──
claude:
  api:
    base-url: https://api.anthropic.com
    connect-timeout: 5s
    read-timeout: 60s
  ai-journal-briefing:
    model: claude-sonnet-4-6
    max-tokens: 8192
    temperature: 0.7
  # 뉴스 보강(HN 제목 번역 + 키워드 정규화) — 변환 작업이라 저가 모델 + temperature 0
  news-enrichment:
    model: claude-haiku-4-5
    max-tokens: 4096
    temperature: 0.0

# ── JWT (만료시간 공통, secret은 프로파일별) ──
jwt:
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}

# ── Logging (base는 안전하게 INFO — 프로파일에서 필요 시 상향) ──
logging:
  level:
    com.ysh: INFO
    org.flywaydb: INFO
